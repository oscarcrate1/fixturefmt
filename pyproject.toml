[project]
name = "fixturefmt"
version = "0.1.0"
description = "Normalise messy sports fixture text into a consistent format"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
fixturefmt = "fixturefmt.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
